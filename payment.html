<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .pay-card {
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h2 { color: #333; font-size: 20px; }
        .back {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back:hover { text-decoration: underline; }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
            margin-top: 18px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #667eea;
        }

        .amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .amount-btn {
            padding: 12px;
            border: 2px solid #e5e7eb;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
        }
        .amount-btn:hover, .amount-btn.active {
            border-color: #667eea;
            color: #667eea;
            background: #f5f7ff;
        }

        .pay-btn {
            width: 100%;
            margin-top: 25px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
        }

        .card-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        .secure {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="pay-card">
        <div class="header">
            <h2>💳 Пополнение</h2>
            <a href="index.html" class="back">← Назад</a>
        </div>

        <form onsubmit="return handlePayment(event)">
            <label>Сумма пополнения</label>
            <input type="number" id="amount" placeholder="Введите сумму" min="1" required>

            <div class="amounts">
                <button type="button" class="amount-btn" onclick="setAmount(500, this)">500 ₽</button>
                <button type="button" class="amount-btn" onclick="setAmount(1000, this)">1000 ₽</button>
                <button type="button" class="amount-btn" onclick="setAmount(2000, this)">2000 ₽</button>
            </div>

            <label>Номер карты</label>
            <input type="text" id="card" placeholder="0000 0000 0000 0000" maxlength="19" required>

            <div class="card-row">
                <div>
                    <label>Срок</label>
                    <input type="text" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div>
                    <label>CVC</label>
                    <input type="text" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="pay-btn">Оплатить</button>
            <p class="secure">🔒 Тестовый режим — данные не отправляются</p>
        </form>
    </div>

    <script>
        function setAmount(value, btn) {
            document.getElementById('amount').value = value;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // автоформат номера карты
        document.getElementById('card').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
            e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
        });

        function handlePayment(e) {
            e.preventDefault();
            const amount = document.getElementById('amount').value;
            alert('✅ Тестовая оплата на сумму ' + amount + ' ₽ прошла успешно!\n\n(это демо, деньги не списаны)');
            window.location.href = 'index.html';
            return false;
        }
    </script>
</body>
</html>
